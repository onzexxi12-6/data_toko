<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Inventaris</title>
    <!-- jsPDF & html2canvas untuk export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
</head>

<body>
    <div class="container" id="app">
        <h1>📦 Manajemen Inventaris</h1>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="primary" id="backupBtn"> Backup Data</button>
            <button class="outline" id="restoreBtn"> Restore Data</button>
            <button class="outline" id="resetDefaultBtn"> Reset Default</button>
            <button class="danger" id="clearAllBtn"> Hapus Semua</button>
            <button id="undoBtn" title="Undo">↩️ Undo</button>
            <button id="redoBtn" title="Redo">↪️ Redo</button>
            <button class="outline" id="exportPdfBtn"> Export PDF</button>
            <button class="outline" id="clearExportBtn"> Kosongkan</button>
            <span class="badge" id="itemCount">0 item</span>
                        
        </div>

        <!-- Form tambah / edit -->
        <div class="form-bar" id="formBar">
            <div class="form-group">
                <label>Nama Barang</label>
                <input type="text" id="namaBarang" placeholder="Contoh: Kertas A4" />
            </div>
            <div class="form-group">
                <label>Jumlah</label>
                <input type="number" id="jumlahBarang" placeholder="0" min="0" />
            </div>
            <div class="form-group">
                <label>Harga (Rp)</label>
                <input type="number" id="hargaBarang" placeholder="0" min="0" />
            </div>
            <div class="form-group">
                <label>Satuan</label>
                <select id="satuanBarang">
                    <option value="Unit">Unit</option>
                    <option value="Botol">Botol</option>
                    <option value="Kotak">Kotak</option>
                    <option value="Lembar">Lembar</option>
                    <option value="Pcs">Pcs</option>
                    <option value="Kg">Kg</option>
                    <option value="Liter">Liter</option>
                    <option value="Pak">Pak</option>
                    <option value="Dus">Dus</option>
                    <option value="Goni">Goni</option>
                </select>
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <button class="btn-add" id="addBtn">Tambah</button>
            </div>
        </div>

        <!-- Tabel data -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Jumlah</th>
                        <th>Harga</th>
                        <th>Satuan</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyBarang"></tbody>
            </table>
        </div>

        <!-- Tabel Hasil Export Barang Habis -->
        <div class="export-table-wrap">
        <br>
            <h3>
                📋 Daftar Barang Habis
                <span class="badge-export" id="exportCount">0</span>
            </h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nama Barang</th>
                            <th>Jumlah</th>
                            <th>Satuan</th>
                            <th>Harga</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyExport"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal PDF Preview & Edit -->
    <div id="pdfModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>✏️ Edit Jumlah & Preview PDF</h2>
            <div class="info-pdf">
                📌 Kolom <strong>Harga</strong> dikosongkan untuk diisi manual saat pembelian.
            </div>
            <div class="slider-label">
                <span>Ukuran teks</span>
                <span id="sizeLabel">8px</span>
            </div>
            <input type="range" id="pdfSizeSlider" min="8" max="20" value="8" step="1" />

            <div id="pdfPreviewWrap" class="preview-pdf-area">
            </div>

            <div class="actions">
                <button class="btn-secondary" id="closePdfModal">Tutup</button>
                <button class="btn-primary" id="downloadPdfBtn">⬇️ Export PDF (A4)</button>
            </div>
        </div>
    </div>
    
    <style>
        /* style.css */
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: #f4f7fc;
          padding: 20px;
          color: #1e293b;
        }
        .container {
          max-width: 1400px;
          margin: 0 auto;
          background: white;
          padding: 24px;
          border-radius: 24px;
          box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }
        h1 {
          display: flex;
          align-items: center;
          gap: 12px;
          font-weight: 600;
          font-size: 28px;
          margin-bottom: 24px;
          color: #0f172a;
        }
        .toolbar {
          display: flex;
          flex-wrap: wrap;
          gap: 10px 12px;
          margin-bottom: 28px;
          align-items: center;
          background: #f8fafc;
          padding: 16px 20px;
          border-radius: 20px;
          border: 1px solid #e2e8f0;
        }
        .toolbar button {
          background: white;
          border: 1px solid #cbd5e1;
          padding: 6px 16px;
          border-radius: 40px;
          font-weight: 500;
          font-size: 14px;
          cursor: pointer;
          transition: all 0.15s;
          color: #1e293b;
          box-shadow: 0 1px 2px rgba(0,0,0,0.02);
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .toolbar button:hover {
          background: #eef2f6;
          border-color: #94a3b8;
        }
        .toolbar button.primary {
          background: #2563eb;
          border-color: #2563eb;
          color: white;
        }
        .toolbar button.primary:hover {
          background: #1d4ed8;
        }
        .toolbar button.danger {
          background: #ef4444;
          border-color: #ef4444;
          color: white;
        }
        .toolbar button.danger:hover {
          background: #dc2626;
        }
        .toolbar button.outline {
          background: transparent;
          border: 1px solid #94a3b8;
        }
        .toolbar .spacer {
          flex: 1;
        }
        .toolbar .badge {
          background: #dbeafe;
          color: #1e4fd9;
          padding: 4px 14px;
          border-radius: 40px;
          font-size: 13px;
          font-weight: 500;
        }
        .form-bar {
          display: flex;
          flex-wrap: wrap;
          gap: 10px 14px;
          background: #f1f5f9;
          padding: 18px 20px;
          border-radius: 20px;
          margin-bottom: 30px;
          align-items: flex-end;
        }
        .form-group {
          display: flex;
          flex-direction: column;
          gap: 4px;
          flex: 1 0 110px;
        }
        .form-group label {
          font-size: 12px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.3px;
          color: #475569;
        }
        .form-group input, .form-group select {
          padding: 8px 12px;
          border: 1px solid #cbd5e1;

          background: white;

        }
        .form-group input:focus, .form-group select:focus {

        .form-group .btn-add {
          background: #2563eb;

        }
        .table-wrap {
          overflow-x: auto;
          border-radius: 18px;
          border: 1px solid #e2e8f0;
          background: white;
        }
        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 14px;
        }
        th {
          text-align: left;
          padding: 14px 12px;
          background: #f8fafc;
          border-bottom: 1px solid #e2e8f0;

          color: #334155;
        }
        td {
          padding: 12px;
          border-bottom: 1px solid #f1f5f9;

        }
        tr:last-child td {
          border-bottom: none;
        }

          display: inline-block;

        .status-tersedia {
          background: #dcfce7;
          color: #15803d;
        }
        .status-habis {
          background: #fee2e2;

        }
        .btn-group {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
        }
        .btn-group button {
          background: transparent;
          border: 1px solid #d1d9e6;
          padding: 4px 10px;
          border-radius: 30px;
          font-size: 12px;

          transition: 0.1s;
          color: #1e293b;
        }
        .btn-group button:hover {

        }
        .btn-group button.edit {
          border-color: #fbbf24;
          background: #fef9c3;
        }
        .btn-group button.edit:hover {
          background: #fde68a;
        }
        .btn-group button.danger {
          border-color: #fca5a5;
          background: #fee2e2;
        }
        .btn-group button.danger:hover {
          background: #fecaca;
        }
        .btn-group button.status {
          border-color: #93c5fd;
          background: #dbeafe;
        }
        .btn-group button.status:hover {
          background: #bfdbfe;
        }
        .empty-state {
          padding: 50px 20px;
          text-align: center;
          color: #64748b;
        }
        .hidden {
          display: none !important;
        }
        .modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(15,23,42,0.5);

        }
        .modal-card {

        }

        /* ===== STYLE PREVIEW YANG MIRIP HASIL EXPORT PDF ===== */

            font-family: 'Courier New', monospace;

        }
        #pdfPreviewWrap .preview-content table {
            width: 100%;
            border-collapse: collapse;
            font-family: inherit;
        }

        #pdfPreviewWrap .preview-content td {
            text-align: left;
            padding: 2px 4px;
            border: none;
        }
        #pdfPreviewWrap .preview-content th {
            border-bottom: 1px solid #000;
            font-weight: bold;
        }
        #pdfPreviewWrap .preview-content tfoot td {
            border-top: 1px solid #000;
            font-style: italic;
            padding-top: 4px;
        }
    </style>
    

    <script>
        // ==================== script.js ====================
        let items = [];
        let nextId = 1;
        let undoStack = [];
        let redoStack = [];
        let editingId = null;
        let DEFAULT_DATA = []; // Akan diisi dari file JSON
        
        // Referensi DOM
        const tbody = document.getElementById('tbodyBarang');
        const tbodyExport = document.getElementById('tbodyExport');
        const namaInput = document.getElementById('namaBarang');
        const jumlahInput = document.getElementById('jumlahBarang');
        const hargaInput = document.getElementById('hargaBarang');
        const satuanSelect = document.getElementById('satuanBarang');
        const addBtn = document.getElementById('addBtn');
        const itemCount = document.getElementById('itemCount');
        const exportCount = document.getElementById('exportCount');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const clearExportBtn = document.getElementById('clearExportBtn');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        
        // ----- Load default data from JSON file -----
        async function loadDefaultData() {
          try {
            const response = await fetch('default.json');
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            if (Array.isArray(data) && data.length) {
              DEFAULT_DATA = data;
              return true;
            } else {
              console.warn('Default data is empty or invalid');
              return false;
            }
          } catch (error) {
            console.error('Error loading default.json:', error);
            // Fallback data if file cannot be loaded
            DEFAULT_DATA = [
            ];
            return false;
          }
        }
        
        // ----- LocalStorage helpers -----
        function loadFromStorage() {
          const stored = localStorage.getItem('inventaris_data');
          if (stored) {
            try {
              const parsed = JSON.parse(stored);
              if (Array.isArray(parsed) && parsed.length) {
                items = parsed;
                nextId = items.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
                return true;
              }
            } catch (e) {}
          }
          return false;
        }
        
        function saveToStorage() {
          localStorage.setItem('inventaris_data', JSON.stringify(items));
          updateUI();
          renderExportTable();
        }
        
        function resetToDefault() {
          items = DEFAULT_DATA.map(item => ({ ...item }));
          nextId = items.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
          saveToStorage();
          clearUndoRedo();
        }
        
        // ----- Undo/Redo -----
        function pushUndo() {
          undoStack.push(JSON.stringify(items));
          redoStack = [];
        }
        
        function clearUndoRedo() { undoStack = []; redoStack = []; }
        
        function undo() {
          if (!undoStack.length) return;
          redoStack.push(JSON.stringify(items));
          items = JSON.parse(undoStack.pop());
          saveToStorage();
          updateUI();
        }
        
        function redo() {
          if (!redoStack.length) return;
          undoStack.push(JSON.stringify(items));
          items = JSON.parse(redoStack.pop());
          saveToStorage();
          updateUI();
        }
        
        // ----- Render UI -----
        function renderTable() {
          if (!items.length) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">📭 Belum ada barang. Tambahkan atau reset default.</td></tr>`;
            itemCount.textContent = '0 item';
            return;
          }
          let html = '';
          items.forEach((item, idx) => {
            const statusClass = item.status === '✓' ? 'status-tersedia' : 'status-habis';
            html += `<tr>
              <td><strong>${item.nama}</strong></td>
              <td>${item.jumlah}</td>
              <td>Rp ${item.harga.toLocaleString()}</td>
              <td>${item.satuan}</td>
              <td><span class="status-badge ${statusClass}">${item.status}</span></td>
              <td>
                <div class="btn-group">
                    <button class="edit" data-id="${item.id}">
                        <svg viewBox="0 0 512 512" width="14" height="14" fill="currentColor">
                            <path d="M362.7 19.3L314.3 67.7L444.3 197.7L492.7 149.3C517.7 124.3 517.7 83.8 492.7 58.8L453.2 19.3C428.2-5.7 387.7-5.7 362.7 19.3zM291.7 90.3L25.4 356.6C20.7 361.3 17.2 367.2 15.2 373.6L.4 462.8C-1.1 472 1.8 481.4 8.5 488.1s16.1 9.6 25.3 8.1l89.2-14.8c6.4-2 12.3-5.5 17-10.2L406.3 205.7L291.7 90.3z"/>
                        </svg>
                    </button>

                    <button class="status" data-id="${item.id}">
                        <svg 
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 512 512"
                            width="14"
                            height="14"
                            fill="currentColor">
                            <path d="M142.9 96.4C171.3 75.1 206.6 64 242.9 64H288V16c0-6.5 3.9-12.3 9.9-14.8s13-1.4 17.6 3.2l80 80c6.2 6.2 6.2 16.4 0 22.6l-80 80c-4.6 4.6-11.6 5.7-17.6 3.2S288 183.5 288 177V128H242.9c-25.8 0-50.9 7.9-72 22.6C148.1 166.3 132 189.2 125 215.3l-46.3-12.4c9.7-36.3 31.5-68.1 64.2-106.5zM369.1 415.6C340.7 436.9 305.4 448 269.1 448H224v48c0 6.5-3.9 12.3-9.9 14.8s-13 1.4-17.6-3.2l-80-80c-6.2-6.2-6.2-16.4 0-22.6l80-80c4.6-4.6 11.6-5.7 17.6-3.2s9.9 8.3 9.9 14.8v49h45.1c25.8 0 50.9-7.9 72-22.6 22.8-15.7 38.9-38.6 45.9-64.7l46.3 12.4c-9.7 36.3-31.5 68.1-64.2 106.5z"/>
                        </svg>
                    </button>
                    
                    <button class="danger" data-id="${item.id}">
                        <svg viewBox="0 0 448 512" width="14" height="14" fill="currentColor">
                            <path d="M135.2 17.7C140.9 7 151.9 0 164 0h120c12.1 0 23.1 7 28.8 17.7L328 32h88c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 96 0 81.7 0 64s14.3-32 32-32h88l15.2-14.3zM32 128h384l-20.5 352.5c-1 17.6-15.6 31.5-33.2 31.5H85.7c-17.6 0-32.2-13.9-33.2-31.5L32 128zm112 64c-8.8 0-16 7.2-16 16v240c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16zm96 0c-8.8 0-16 7.2-16 16v240c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16zm96 0c-8.8 0-16 7.2-16 16v240c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16z"/>
                        </svg>
                    </button>
                </div>
              </td>
            </tr>`;
          });
          tbody.innerHTML = html;
          itemCount.textContent = `${items.length} item`;
        }
        
        // ----- Render Export Table (Barang Habis) -----
        function renderExportTable() {
          const habis = items.filter(item => item.status === '✕');
          
          if (!habis.length) {
            tbodyExport.innerHTML = `<tr><td colspan="5" class="export-empty">✅ Tidak ada barang dengan status Habis</td></tr>`;
            exportCount.textContent = '0';
            return;
          }
          
          let html = '';
          habis.forEach((item, idx) => {
            html += `<tr>
              <td><strong>${item.nama}</strong></td>
              <td>${item.jumlah}</td>
              <td>${item.satuan}</td>
              <td><span style="color:#94a3b8; font-style:italic;"></span></td>
              <td><span class="status-badge status-habis">Habis</span></td>
            </tr>`;
          });
          tbodyExport.innerHTML = html;
          exportCount.textContent = habis.length;
        }
        
        function updateUI() {
          renderTable();
          renderExportTable();
          if (editingId === null) {
            addBtn.textContent = 'Tambah';
            namaInput.value = '';
            jumlahInput.value = '';
            hargaInput.value = '';
            satuanSelect.value = 'Unit';
          }
        }
        
        // ----- CRUD -----
        function addOrUpdate() {
          const nama = namaInput.value.trim();
          const jumlah = parseInt(jumlahInput.value) || 0;
          const harga = parseInt(hargaInput.value) || 0;
          const satuan = satuanSelect.value;
        
          <!-- if (!nama) { alert('Nama barang harus diisi'); return; } -->
        
          pushUndo();
        
          if (editingId !== null) {
            const idx = items.findIndex(i => i.id === editingId);
            if (idx !== -1) {
              items[idx] = { ...items[idx], nama, jumlah, harga, satuan };
            }
            editingId = null;
          } else {
            const status = jumlah > 0 ? '✓' : '✕';
            items.push({ id: nextId++, nama, jumlah, harga, satuan, status });
          }
          saveToStorage();
          updateUI();
          addBtn.textContent = 'Tambah';
          editingId = null;
        }
                
        function deleteItem(id) {
            pushUndo();
        
            items = items.filter(i => i.id !== id);
        
            saveToStorage();
            updateUI();
        }
        
        function toggleStatus(id) {
          pushUndo();
          const item = items.find(i => i.id === id);
          if (item) {
            item.status = item.status === '✓' ? '✕' : '✓';
            if (item.status === '✓' && item.jumlah === 0) item.jumlah = 1;
            saveToStorage();
            updateUI();
          }
        }
        
        function editItem(id) {
          const item = items.find(i => i.id === id);
          if (!item) return;
          editingId = id;
          namaInput.value = item.nama;
          jumlahInput.value = item.jumlah;
          hargaInput.value = item.harga;
          satuanSelect.value = item.satuan;
          addBtn.textContent = 'Update';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // ----- Event listener -----
        tbody.addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const id = parseInt(btn.dataset.id);
          if (btn.classList.contains('edit')) editItem(id);
          else if (btn.classList.contains('status')) toggleStatus(id);
          else if (btn.classList.contains('danger')) deleteItem(id);
        });
        
        addBtn.addEventListener('click', addOrUpdate);
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);
        
        // ----- Backup, Restore, Reset, Clear -----
        document.getElementById('backupBtn').addEventListener('click', () => {
          const dataStr = JSON.stringify(items, null, 2);
          const blob = new Blob([dataStr], {type: 'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `backup_inventaris_${new Date().toISOString().slice(0,10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
        });
        
        document.getElementById('restoreBtn').addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = '.json';
          input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const data = JSON.parse(ev.target.result);
                if (Array.isArray(data) && data.length) {
                  pushUndo();
                  items = data;
                  nextId = items.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
                  saveToStorage();
                  updateUI();
                  alert('Data berhasil direstore!');
                } else alert('File tidak valid');
              } catch (err) { alert('Gagal membaca file'); }
            };
            reader.readAsText(file);
          };
          input.click();
        });
        
        document.getElementById('resetDefaultBtn').addEventListener('click', () => {
          if (confirm('Reset ke data default? (data saat ini akan hilang)')) {
            pushUndo();
            resetToDefault();
            updateUI();
          }
        });
        
        document.getElementById('clearAllBtn').addEventListener('click', () => {
          if (confirm('Hapus semua data barang?')) {
            pushUndo();
            items = [];
            saveToStorage();
            updateUI();
          }
        });
        
        // ----- Clear Export (kosongkan semua barang habis) -----
        clearExportBtn.addEventListener('click', () => {
          const habis = items.filter(item => item.status === '✕');
          if (!habis.length) {
            alert('Tidak ada barang dengan status Habis.');
            return;
          }
          if (!confirm(`Hapus semua ${habis.length} barang dengan status Habis?`)) return;
          pushUndo();
          items = items.filter(item => item.status !== '✕');
          saveToStorage();
          updateUI();
        });
        
        // ========== EXPORT PDF "BARANG HABIS" ==========
        const pdfModal = document.getElementById('pdfModal');
        const pdfPreviewWrap = document.getElementById('pdfPreviewWrap');
        const pdfSizeSlider = document.getElementById('pdfSizeSlider');
        const sizeLabel = document.getElementById('sizeLabel');
        let pdfItems = [];
        
        // Export PDF dari tombol di tabel export
        exportPdfBtn.addEventListener('click', () => {
          const habis = items.filter(item => item.status === '✕');
          if (!habis.length) { 
            alert('Tidak ada barang dengan status Habis.'); 
            return; 
          }
          pdfItems = habis.map(item => ({ ...item }));
          renderPdfPreview();
          pdfModal.classList.remove('hidden');
        });
        
        // ===== PREVIEW YANG MIRIP HASIL EXPORT PDF =====
        function renderPdfPreview() {
          const size = parseInt(pdfSizeSlider.value) || 8;
          sizeLabel.textContent = size + 'px';
          const previewSize = Math.max(6, size);
          
          let html = `<div class="preview-content" style="font-size:${previewSize}px;">
            <div style="font-weight:bold; text-align:center; font-size:${previewSize + 2}px; margin-bottom:4px;">
              DAFTAR BARANG HABIS
            </div>
            <table>
              <thead>
                <tr>
                  <th style="width:10%;">No</th>
                  <th style="width:50%;">Nama Barang</th>
                  <th style="width:20%;">Jumlah</th>
                  <th style="width:20%;">Harga</th>
                </tr>
              </thead>
              <tbody>`;
          
          pdfItems.forEach((item, idx) => {
            const no = idx + 1;
            html += `<tr>
              <td>${no}.</td>
              <td>${item.nama}</td>
              <td>${item.jumlah} ${item.satuan}</td>
              <td>&nbsp;</td>
            </tr>`;
          });
          
          html += `</tbody>
              <tfoot>
                <tr>
                  <td colspan="4" style="font-style:italic; font-size:${Math.max(6, previewSize - 1)}px;">
                    Total: ${pdfItems.length} item
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>`;
          
          pdfPreviewWrap.innerHTML = html;
        }
        
        pdfSizeSlider.addEventListener('input', renderPdfPreview);
        
        document.getElementById('closePdfModal').addEventListener('click', () => {
          pdfModal.classList.add('hidden');
        });
        
        // ===== EXPORT PDF =====
        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF('p', 'mm', 'a4');
          const size = parseInt(pdfSizeSlider.value) || 8;
          
          const fontSize = Math.max(6, Math.round(size * 0.7));
          doc.setFontSize(fontSize);
          
          const marginLeft = 12;
          const marginTop = 15;
          let y = marginTop;
          const lineHeight = fontSize * 0.5;
          
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(fontSize + 2);
          doc.text('DAFTAR BARANG HABIS', marginLeft, y);
          y += lineHeight + 1;
          
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(Math.max(5, fontSize - 1));
          y += lineHeight + 2;
          
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(fontSize);
          
          const col1 = marginLeft;
          const col2 = marginLeft + 5;
          const col3 = marginLeft + 50;
          const col4 = marginLeft + 70;
          
          doc.text('Nama Barang', col2, y);
          doc.text('Jumlah', col3, y);
          doc.text('Harga', col4, y);
          
          const lineY = y + 1.5;
          doc.setLineWidth(0.2);
          doc.line(marginLeft, lineY, marginLeft + 165, lineY);
          
          y += lineHeight + 1.5;
          
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(fontSize);
          
          pdfItems.forEach((item, idx) => {
            if (y + lineHeight > 275) {
              doc.addPage();
              y = marginTop;
              
              doc.setFont('helvetica', 'bold');
              doc.setFontSize(fontSize);
              doc.text('Nama Barang', col2, y);
              doc.text('Jumlah', col3, y);
              doc.text('Harga', col4, y);
              doc.line(marginLeft, y + 1.5, marginLeft + 165, y + 1.5);
              y += lineHeight + 1.5;
              doc.setFont('helvetica', 'normal');
            }
            
            const no = (idx + 1) + '.';
            const nama = item.nama.length > 30 ? item.nama.substring(0, 27) + '…' : item.nama;
            const jumlah = item.jumlah + ' ' + item.satuan;
            
            doc.text(nama, col2, y);
            doc.text(jumlah, col3, y);
            doc.text('', col4, y);
            
            y += lineHeight;
          });
          
          doc.save('barang_habis.pdf');
        });
        
        // ========== INITIALIZATION ==========
        async function init() {
          await loadDefaultData();
          
          if (!loadFromStorage()) {
            items = DEFAULT_DATA.map(item => ({ ...item }));
            nextId = items.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
            saveToStorage();
          }
          updateUI();
        }
        
        init();
        window.defaultJSON = DEFAULT_DATA;
    </script>
</body>

</html>
